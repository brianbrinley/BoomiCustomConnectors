name: JEV Connector

on:
  push:
    branches: [main]
    paths:
      - "jev-connector/**"
      - "!jev-connector/dist/**"
      - ".github/workflows/jev-connector.yml"
    tags:
      - "jev-connector-v*"
  pull_request:
    paths:
      - "jev-connector/**"
      - ".github/workflows/jev-connector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jev-connector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload connector archive
        uses: actions/upload-artifact@v4
        with:
          name: jev-connector-car
          path: |
            jev-connector/target/jev-connector-*-bundle.zip
            jev-connector/target/jev-connector-*-car.zip
            jev-connector/src/main/resources/connector-descriptor.xml
          if-no-files-found: error

      # Keeps a ready-to-download copy of the bundle in the repository at jev-connector/dist/.
      # Pushes made with the workflow token do not start other workflows, so this cannot loop.
      - name: Commit the bundle to jev-connector/dist (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p jev-connector/dist
          rm -f jev-connector/dist/jev-connector-*-bundle.zip
          cp jev-connector/target/jev-connector-*-bundle.zip jev-connector/dist/
          git add -A jev-connector/dist
          if git diff --cached --quiet; then
            echo "Bundle is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the compiled JEV connector bundle [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/jev-connector-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jev-connector/target/jev-connector-*-bundle.zip
            jev-connector/target/jev-connector-*-car.zip
            jev-connector/src/main/resources/connector-descriptor.xml
